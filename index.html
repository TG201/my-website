
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(135deg,
                #0f172a,
                #1e40af,
                #4f46e5);
        }

        /* Login Card */

        .login-card {
            width: 400px;
            max-width: 92%;
            background: #ffffff;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.30);
        }

        /* Heading */

        h1 {
            text-align: center;
            font-size: 28px;
            color: #111827;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;

            margin-bottom: 30px;
        }

        /* Input */

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;
            font-weight: bold;

            color: #374151;
        }

        input[type="email"],
        input[type="password"] {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;
            border-radius: 9px;

            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* Options */

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin: 5px 0 22px;

            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;

            color: #6b7280;
        }

        .remember input {
            width: 15px;
            height: 15px;
        }

        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Login Button */

        .login-button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 9px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
            text-decoration: none;
display: block;
text-align: center;
        }

        .login-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(37, 99, 235, 0.3);
        }


        /* Mobile */

        @media (max-width: 450px) {

            .login-card {
                padding: 30px 25px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card">

        <!-- Heading -->
        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to continue to your account
        </p>

        <!-- Login Form -->
        <form action="#" method="post">

            <!-- Email -->
            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com(anything)"
                    required
                >

            </div>

            <!-- Password -->
            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password(anything)"
                    required
                >

            </div>

            <!-- Options -->
            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        name="remember"
                    >

                    Remember me

                </label>
              
            </div>

            <!-- Login -->
            <a href="Audio_page.html" class="login-button">
    Log In
</a>

        </form>

    </div>

</body>
</html>
